<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Store</title>
</head>
<body>
    <header>
        <h3>Cadastre seu Veículo para vender mais rápido</h3>
    </header>
    <div>
        <div>
            <p>Formulário</p>
        </div>

        <div>
            <h1>Venda fácil seu carro</h1>
            <p>Descreva as características do seu carro e marque os opcionais que ele possui</p>
            <form>
                <div>
                    <label for="title">Título do Anúncio <span>*</span></label>
                    <input type="text" name="title" id="title" placeholder="Um título para anunciar seu veículo">
                </div>
                <div>
                    <label for="preço">Preço <span>*</span></label>
                    <input type="number" name="preço" id="preço" placeholder="Defina o preço">
                </div>
                <div>
                    <label for="descricao">Descrição <span>*</span></label>
                    <textarea name="descricao" id="descricao" placeholder="Faça a descrição de seu veículo"></textarea>
                </div>
                <div>
                    <label for="marca">Marca <span>*</span></label>
                    <input type="text" name="marca" id="marca" placeholder="Defina a marca de seu veículo">
                </div>
                <div>
                    <label for="modelo">Modelo <span>*</span></label>
                    <input type="text" name="modelo" id="modelo" placeholder="Defina o modelo de seu veículo">
                </div>
                <div>
                    <label for="quilometragem">Quilometragem <span>*</span></label>
                    <input type="text" name="quilometragem" id="quilometragem" placeholder="Quilometragem de seu veículo">
                </div>
                <div>
                    <label for="data">Data de compra <span>*</span></label>
                    <input type="date" name="data" id="data">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
