<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Store</title>
</head>
<body>
    <header>
        <h3>Cadastre seu Veículo para vender mais rápido</h3>
    </header>
    <div>
        <div>
            <p>Formulário</p>
        </div>

        <div>
            <h1>Venda fácil seu carro</h1>
            <p>Descreva as características do seu carro e marque os opcionais que ele possui</p>
            <form>
                <div>
                    <label for="title">Título do Anúncio <span>*</span></label>
                    <input type="text" name="title" id="title" placeholder="Um título para anunciar seu veículo">
                </div>
                <div>
                    <label for="preço">Preço <span>*</span></label>
                    <input type="number" name="preço" id="preço" placeholder="Defina o preço">
                </div>
                <div>
                    <label for="descricao">Descrição <span>*</span></label>
                    <textarea name="descricao" id="descricao" placeholder="Faça a descrição de seu veículo"></textarea>
                </div>
                <div>
                    <label for="marca">Marca <span>*</span></label>
                    <input type="text" name="marca" id="marca" placeholder="Defina a marca de seu veículo">
                </div>
                <div>
                    <label for="modelo">Modelo <span>*</span></label>
                    <input type="text" name="modelo" id="modelo" placeholder="Defina o modelo de seu veículo">
                </div>
                <div>
                    <label for="quilometragem">Quilometragem <span>*</span></label>
                    <input type="text" name="quilometragem" id="quilometragem" placeholder="Quilometragem de seu veículo">
                </div>
                <div>
                    <label for="data">Data de compra <span>*</span></label>
                    <input type="date" name="data" id="data">
                </div>
                <div>
                    <p>Tipo de câmbio: <span>*</span></p>
                    <input type="radio" name="marcha" id="manual">
                    <label for="Manual">Manual</label>
                    <input type="radio" name="marcha" id="auto">
                    <label for="auto">Automático</label>
                </div>
                <div>
                    <p>Opicionais</p>
                    <ul>
                        <li>
                            <input type="checkbox" name="opcional[]" id="airbag" value="airbag">
                            <label for="airbag">Airbag</label>
                        </li>
                        <li>
                            <input type="checkbox" name="opcional[]" id="alarme" value="alarme">
                            <label for="alarme">Alarme</label>
                        </li>
                        <li>
                            <input type="checkbox" name="opcional[]" id="ar_condicionado" value="ar_condicionado">
                            <label for="ar_condicionado">Ar condicionado</label>
                        </li>
                        <li>
                            <input type="checkbox" name="opcional[]" id="camera_de_re" value="camera_de_re">
                            <label for="camera_de_re">Câmera de ré</label>
                        </li>
                    </ul>
                </div>
                <div>
                    <ul>
                        <li>
                            <input type="checkbox" name="opcional[]" id="assistente_de_pista" value="assistente_de_pista">
                            <label for="assistente_de_pista">Assistente de pista</label>
                        </li>
                        <li>
                            <input type="checkbox" name="opcional[]" id="partida_sem_chave" value="partida_sem_chave">
                            <label for="partida_sem_chave">Partida sem chave</label>
                        </li>
                        <li>
                            <input type="checkbox" name="opcional[]" id="smartphone" value="smartphone">
                            <label for="smartphone">Integração com celular</label>
                        </li>
                        <li>
                            <input type="checkbox" name="opcional[]" id="banco_de_couro" value="banco_de_couro">
                            <label for="banco_de_couro">Banco de couro</label>
                        </li>
                    </ul>
                </div>

            </form>
        </div>
    </div>
</body>
</html>
